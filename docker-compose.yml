# ============================================================
# Docker Compose for DMH
# ------------------------------------------------------------
# Services included:
#   - postgres      (api-user DB)
#   - keycloak-db   (Keycloak DB)
#   - keycloak      (Identity Provider)
#   - api-eureka    (Service Discovery - port 8761)
#   - api-user      (User microservice - port 8081)
#   - api-gateway   (API Gateway - port 8083)
#
# ============================================================

version: "3.9"

services:

  # -------------------------------------------------------
  # PostgreSQL - Database for api-user
  # -------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: dmh-postgres
    env_file:
      - api-user.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dmh-network

  # -------------------------------------------------------
  # Keycloak DB - Dedicated database for Keycloak
  # -------------------------------------------------------
  keycloak-db:
    image: postgres:16-alpine
    container_name: dmh-keycloak-db
    env_file:
      - api-user.env
    environment:
      POSTGRES_DB: ${KEYCLOAK_DB}
      POSTGRES_USER: ${KEYCLOAK_DB_USER}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KEYCLOAK_DB_USER} -d ${KEYCLOAK_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dmh-network

  # -------------------------------------------------------
  # Keycloak - Identity Provider
  #   - Starts with its own PostgreSQL DB.
  #   - Auto-imports the realm and clients from
  #     `Project/DMH/keycloak/realm-export.json`.
  # -------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:26.5.6
    container_name: dmh-keycloak
    command: ["start-dev", "--import-realm"]
    env_file:
      - api-user.env
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/${KEYCLOAK_DB}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
    ports:
      - "${KEYCLOAK_HTTP_PORT:-8080}:8080"
    volumes:
      - ./Project/DMH/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    depends_on:
      keycloak-db:
        condition: service_healthy
    networks:
      - dmh-network

  # -------------------------------------------------------
  # api-eureka - Service Discovery (must start FIRST)
  # -------------------------------------------------------
  api-eureka:
    build:
      context: ./Project/DMH
      dockerfile: api-eureka/Dockerfile
    image: dmh/api-eureka:0.0.1-SNAPSHOT
    container_name: dmh-api-eureka
    ports:
      - "8761:8761"
    environment:
      SERVER_PORT: 8761
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8761/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - dmh-network

  # -------------------------------------------------------
  # api-user - User microservice
  # Depends on: postgres, keycloak, api-eureka
  # -------------------------------------------------------
  api-user:
    build:
      context: ./Project/DMH
      dockerfile: api-user/Dockerfile
    image: dmh/api-user:0.0.1-SNAPSHOT
    container_name: dmh-api-user
    env_file:
      - api-user.env
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE}
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: "true"
      EUREKA_CLIENT_FETCH_REGISTRY: "true"
      # The issuer-uri must use the Docker service name `keycloak` (not localhost)
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI}
      KEYCLOAK_SERVER_URL: http://keycloak:${KEYCLOAK_HTTP_PORT:-8080}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      api-eureka:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - dmh-network

  # -------------------------------------------------------
  # api-gateway - API Gateway
  # Depends on: api-eureka, api-user
  # -------------------------------------------------------
  api-gateway:
    build:
      context: ./Project/DMH
      dockerfile: api-gateway/Dockerfile
    image: dmh/api-gateway:0.0.1-SNAPSHOT
    container_name: dmh-api-gateway
    ports:
      - "8083:8083"
    environment:
      SERVER_PORT: 8083
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://api-eureka:8761/eureka
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: "true"
      EUREKA_CLIENT_FETCH_REGISTRY: "true"
      SPRING_CLOUD_LOADBALANCER_ENABLED: "true"
    depends_on:
      api-eureka:
        condition: service_started
      api-user:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - dmh-network

# -------------------------------------------------------
# Networks and volumes
# -------------------------------------------------------
networks:
  dmh-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  keycloak_db_data:
    driver: local
